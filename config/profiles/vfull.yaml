# SIEVE Profile: vfull — first run on the full extracted corpus.
#
# corpus_vfull: 8.77M total tokens (train 7.46M / val 0.88M / test 0.44M),
# vocab=8000 (tokenizer v005), 1406 source docs after sha/too-small dedup.
# ~2× the v009 regime that exp007 ran against.
#
# Shape mirrors exp007 (pop=8, ens=4, brute-force C(8,4)=70) so results are
# directly comparable. The jump is data volume, not search geometry.

model:
  n_layer: 3
  n_head: 4
  n_embd: 192
  block_size: 256
  dropout: 0.2
  bias: false
  vocab_size: 8000

training:
  epochs: 6
  batch_size: 32
  learning_rate: 3e-4
  weight_decay: 1.0
  warmup_fraction: 0.05
  lr_schedule: cosine
  optimizer: adamw
  gradient_clip: 1.0
  shuffle_per_epoch: true

evolution:
  population_size: 8
  ensemble_size: 4
  elite_fraction: 0.25
  immigration_fraction: 0.125
  mutation_strength: 0.2
  max_generations: 5
  stagnation_patience: 3
  eval_combinations: 70

ensemble:
  eval_batch_size: 32
  aggregator: logit_mean_smoothed
  smoothing_eps: 0.05

paths:
  corpus_dir: ./data/corpus_vfull
  checkpoint_dir: ./checkpoints/vfull
  results_dir: ./results/vfull
  lineage_db: ./results/vfull/lineage.db

# Same small-architecture envelope as exp007. At vocab=8000, block=256:
#   (n_layer=2, n_embd=128) ≈ 1.4M params  → ~5 tokens/param
#   (n_layer=3, n_embd=192) ≈ 2.3M params  → ~3 tokens/param
#   (n_layer=4, n_embd=256) ≈ 4.1M params  → ~2 tokens/param
# With 7.46M train tokens this is a healthier density regime than v009.
search_space:
  n_layer: [2, 3, 4]
  n_head: [4]
  n_embd: [128, 192, 256]
  dropout: [0.1, 0.4]
  weight_decay: [0.3, 8.0]
  learning_rate: [1e-4, 3e-3]
  optimizer: [adamw]
  epochs: [4, 5, 6, 8]
  warmup_fraction: [0.02, 0.1]
  lr_schedule: [cosine, linear]
