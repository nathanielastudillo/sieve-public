# SIEVE Profile: exp007s — SMOKE variant of exp007_v009
#
# Fast-feedback counterpart to exp007_v009 (which will run overnight).
# Same corpus (v009, 4.3M tokens), same aggregator (logit_mean_smoothed),
# same vocab (8000). Differences:
#   - max_generations=1 (no evolution — just gen 0 baseline + ensemble sweep)
#   - epochs ∈ {1, 2, 3} (short schedules, ~1/3 the training time)
#   - population_size=8, ensemble_size=4 (C(8,4)=70 combos, brute-force)
#
# Purpose: confirm whether the needle moves at all — i.e.
#   - any member gets best ind val_loss < log(V)=8.987
#   - any ensemble beats the best individual
# before committing the full 5-generation sweep of the big run.
#
# Runs on 4 spare compute nodes (node-1, node-2, node-3, node-8) pointed at
# Redis DB /1, isolated from the big run on DB /0.

model:
  n_layer: 3
  n_head: 4
  n_embd: 192
  block_size: 256
  dropout: 0.2
  bias: false
  vocab_size: 8000

training:
  epochs: 2
  batch_size: 32
  learning_rate: 3e-4
  weight_decay: 1.0
  warmup_fraction: 0.05
  lr_schedule: cosine
  optimizer: adamw
  gradient_clip: 1.0
  shuffle_per_epoch: true

evolution:
  population_size: 8
  ensemble_size: 4
  elite_fraction: 0.25
  immigration_fraction: 0.125
  mutation_strength: 0.2
  max_generations: 1            # single generation — no evolution
  stagnation_patience: 1
  eval_combinations: 70         # C(8,4) = 70

ensemble:
  eval_batch_size: 32
  aggregator: logit_mean_smoothed
  smoothing_eps: 0.05

paths:
  corpus_dir: ./data/corpus_v009
  checkpoint_dir: ./checkpoints/exp007s
  results_dir: ./results/exp007s
  lineage_db: ./results/exp007s/lineage.db

search_space:
  n_layer: [2, 3, 4]
  n_head: [4]
  n_embd: [128, 192, 256]
  dropout: [0.1, 0.4]
  weight_decay: [0.3, 8.0]
  learning_rate: [1e-4, 3e-3]
  optimizer: [adamw]
  epochs: [1, 2, 3]              # SHORT schedules — key difference from big run
  warmup_fraction: [0.02, 0.1]
  lr_schedule: [cosine, linear]
